<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Participants</title>

  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f5f7fb; }

    header { background:#1e3a8a; color:#fff; padding:15px; }

    .container { padding:15px; }

    .form, .filters, .list {
      background:#fff;
      padding:15px;
      border-radius:10px;
      margin-bottom:15px;
    }

    input, select {
      width:100%;
      padding:8px;
      margin:6px 0;
      border-radius:6px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }

    button {
      padding:8px 12px;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }

    .add {
      background:#16a34a;
      color:#fff;
    }

    .save {
      background:#1e3a8a;
      color:#fff;
      margin-top:10px;
    }

    .save:disabled {
      background:#94a3b8;
      cursor:not-allowed;
    }

    table {
      width:100%;
      border-collapse:collapse;
    }

    th, td {
      padding:10px;
      border-bottom:1px solid #ddd;
      font-size:14px;
    }

    th {
      background:#f1f5f9;
    }

    .status {
      margin-top:10px;
      padding:10px;
      background:#f1f5f9;
      border-radius:6px;
      display:none;
    }

    @media(max-width:600px){
      th, td {
        font-size:12px;
      }
    }
  </style>
</head>

<body>

<header>
  <h2>Participants</h2>
</header>

<div class="container">

  <!-- EXCEL IMPORT SECTION -->
  <div class="form">

    <h3>Import Participants from Excel</h3>

    <input
      type="file"
      id="excelFile"
      accept=".xlsx,.xls"
    />

    <select id="program">
      <option value="">Select Program</option>
    </select>

    <button class="add" id="importExcelBtn">
      Import Excel
    </button>

    <button class="save" id="saveBtn" disabled>
      Save Participants
    </button>

    <div class="status" id="status"></div>

  </div>


  <!-- SEARCH / FILTER -->
  <div class="filters">

    <h3>Search / Filter</h3>

    <input
      type="text"
      id="searchName"
      placeholder="Search by name"
    />

    <input
      type="text"
      id="searchId"
      placeholder="Search by ID"
    />

    <select id="filterProgram">
      <option value="">All Programs</option>
    </select>

  </div>


  <!-- PARTICIPANT LIST -->
  <div class="list">

    <table>

      <thead>
        <tr>
          <th>S/N</th>
          <th>Name</th>
          <th>Gender</th>
          <th>ID</th>
          <th>Program</th>
        </tr>
      </thead>

      <tbody id="tbody"></tbody>

    </table>

  </div>

</div>


<script type="module">

  /* ==========================================
     FIREBASE
     ========================================== */

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

  import {
    getFirestore,
    setDoc,
    doc,
    collection,
    getDocs
  }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


  /* ==========================================
     EXCEL READER
     ========================================== */

  import * as XLSX
    from "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm";


  /* ==========================================
     FIREBASE CONFIGURATION
     ========================================== */

  const firebaseConfig = {
    apiKey: "AIzaSyDWe6LmmWUGlWHv0zb13I6d0bGODfoRQtQ",
    authDomain: "nagari-polyclinic.firebaseapp.com",
    projectId: "nagari-polyclinic",
    storageBucket: "nagari-polyclinic.firebasestorage.app",
    messagingSenderId: "145295689654",
    appId: "1:145295689654:web:b97fb7bfe514ea47dea317",
    measurementId: "G-XL6Y1PB0N5"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  /* ==========================================
     PROGRAM LIST
     ========================================== */

  const programs = [
    "Digital Literacy Executive Class",
    "Use of AI Executive Class",
    "STEM",
    "IDEAS Cohort 2 Digital Literacy",
    "IDEAS Cohort 2 Digital Marketing and E-commerce",
    "IDEAS Cohort 2 Data Science",
    "IDEAS Cohort 2 Cybersecurity"
  ];


  const programSelect =
    document.getElementById("program");

  const filterProgram =
    document.getElementById("filterProgram");


  programs.forEach(program => {

    const option1 =
      document.createElement("option");

    option1.value = program;
    option1.textContent = program;

    programSelect.appendChild(option1);


    const option2 =
      document.createElement("option");

    option2.value = program;
    option2.textContent = program;

    filterProgram.appendChild(option2);

  });


  /* ==========================================
     ELEMENTS
     ========================================== */

  const excelFile =
    document.getElementById("excelFile");

  const importExcelBtn =
    document.getElementById("importExcelBtn");

  const saveBtn =
    document.getElementById("saveBtn");

  const status =
    document.getElementById("status");


  /* ==========================================
     TEMPORARY EXCEL DATA
     ========================================== */

  let importedParticipants = [];


  /* ==========================================
     SHOW STATUS
     ========================================== */

  function showStatus(message) {

    status.style.display = "block";

    status.textContent = message;

  }


  /* ==========================================
     IMPORT EXCEL
     ========================================== */

  importExcelBtn.onclick = async () => {

    const file = excelFile.files[0];

    const selectedProgram =
      programSelect.value;


    /* Check Excel */

    if (!file) {

      alert("Please select an Excel file first.");

      return;

    }


    /* Check program */

    if (!selectedProgram) {

      alert("Please select a program.");

      return;

    }


    try {

      showStatus("Reading Excel file...");


      /* Read Excel file */

      const data =
        await file.arrayBuffer();


      /* Open workbook */

      const workbook =
        XLSX.read(data, {
          type: "array"
        });


      /* First worksheet */

      const sheetName =
        workbook.SheetNames[0];

      const worksheet =
        workbook.Sheets[sheetName];


      /* Convert Excel to JSON */

      const rows =
        XLSX.utils.sheet_to_json(
          worksheet,
          {
            defval: ""
          }
        );


      if (rows.length === 0) {

        alert("The Excel file is empty.");

        return;

      }


      /* Clear previous import */

      importedParticipants = [];


      /* Process rows */

      for (const row of rows) {


        /* ==============================
           GET ID
           ============================== */

        const id = String(

          row["I.D Number"] ||
          row["ID Number"] ||
          row["I.D"] ||
          row["ID"] ||
          row["Participant ID"] ||
          ""

        ).trim();


        /* ==============================
           GET NAME
           ============================== */

        const surname = String(

          row["Surname"] ||
          row["Last Name"] ||
          ""

        ).trim();


        const firstName = String(

          row["First Name"] ||
          row["First name"] ||
          ""

        ).trim();


        const otherName = String(

          row["Other Name"] ||
          row["Other name"] ||
          ""

        ).trim();


        const excelFullName = String(

          row["Full Name"] ||
          row["Name"] ||
          ""

        ).trim();


        /* ==============================
           BUILD FULL NAME
           ============================== */

        let fullName = [

          surname,
          firstName,
          otherName

        ]
        .filter(Boolean)
        .join(" ");


        /* If no separated names,
           use Full Name */

        if (!fullName) {

          fullName = excelFullName;

        }


        /* ==============================
           GET GENDER
           ============================== */

        const gender = String(

          row["Gender"] ||
          ""

        ).trim();


        /* ==============================
           SKIP EMPTY ROWS
           ============================== */

        if (!id || !fullName) {

          continue;

        }


        /* ==============================
           CREATE PARTICIPANT
           ============================== */

        const participant = {

          fullName: fullName,

          name: fullName,

          surname: surname,

          firstName: firstName,

          otherName: otherName,

          gender: gender.toLowerCase(),

          id: id,

          program: selectedProgram

        };


        importedParticipants.push(
          participant
        );

      }


      /* ==================================
         CHECK RESULTS
         ================================== */

      if (importedParticipants.length === 0) {

        alert(
          "No valid participants were found in the Excel file."
        );

        return;

      }


      /* ==================================
         SHOW RESULT
         ================================== */

      showStatus(

        importedParticipants.length +
        " participants loaded from Excel. " +
        "Program: " +
        selectedProgram +
        ". Click Save Participants to save them."

      );


      /* Enable save */

      saveBtn.disabled = false;


      /* Display imported data */

      displayImportedParticipants();


    } catch (error) {

      console.error(error);

      alert(
        "There was an error reading the Excel file.\n\n" +
        error.message
      );

    }

  };


  /* ==========================================
     DISPLAY IMPORTED PARTICIPANTS
     ========================================== */

  function displayImportedParticipants() {

    const tbody =
      document.getElementById("tbody");

    tbody.innerHTML = "";


    importedParticipants.forEach(
      (participant, index) => {

        const tr =
          document.createElement("tr");


        tr.innerHTML = `

          <td>${index + 1}</td>

          <td>${escapeHTML(participant.fullName)}</td>

          <td>${escapeHTML(participant.gender)}</td>

          <td>${escapeHTML(participant.id)}</td>

          <td>${escapeHTML(participant.program)}</td>

        `;


        tbody.appendChild(tr);

      }
    );

  }


  /* ==========================================
     SAVE PARTICIPANTS TO FIREBASE
     ========================================== */

  saveBtn.onclick = async () => {

    if (importedParticipants.length === 0) {

      alert("There are no participants to save.");

      return;

    }


    const selectedProgram =
      programSelect.value;


    if (!selectedProgram) {

      alert("Please select a program.");

      return;

    }


    try {

      saveBtn.disabled = true;

      showStatus(
        "Saving participants to Firebase..."
      );


      let saved = 0;


      /* Save every participant */

      for (
        const participant
        of importedParticipants
      ) {

        await setDoc(

          doc(
            db,
            "participants",
            participant.id
          ),

          participant

        );


        saved++;

      }


      /* ==================================
         SUCCESS
         ================================== */

      showStatus(

        saved +
        " participants successfully saved to " +
        selectedProgram +
        "."

      );


      alert(

        saved +
        " participants have been successfully saved."

      );


      /* Clear temporary data */

      importedParticipants = [];


      /* Clear Excel */

      excelFile.value = "";


      /* Disable save */

      saveBtn.disabled = true;


      /* Reload Firebase data */

      await load();


    } catch (error) {

      console.error(error);

      alert(

        "Error saving participants.\n\n" +
        error.message

      );


      saveBtn.disabled = false;

    }

  };


  /* ==========================================
     LOAD PARTICIPANTS FROM FIREBASE
     ========================================== */

  async function load() {

    try {

      const snap =
        await getDocs(
          collection(
            db,
            "participants"
          )
        );


      const tbody =
        document.getElementById("tbody");


      tbody.innerHTML = "";


      let i = 1;


      snap.forEach(docSnapshot => {

        const participant =
          docSnapshot.data();


        /* Search by name */

        if (

          searchName.value &&

          !String(
            participant.fullName || ""
          )
          .toLowerCase()
          .includes(
            searchName.value.toLowerCase()
          )

        ) {

          return;

        }


        /* Search by ID */

        if (

          searchId.value &&

          !String(
            participant.id || ""
          )
          .toLowerCase()
          .includes(
            searchId.value.toLowerCase()
          )

        ) {

          return;

        }


        /* Filter by program */

        if (

          filterProgram.value &&

          participant.program !==
          filterProgram.value

        ) {

          return;

        }


        const tr =
          document.createElement("tr");


        tr.innerHTML = `

          <td>${i++}</td>

          <td>${escapeHTML(participant.fullName || "")}</td>

          <td>${escapeHTML(participant.gender || "")}</td>

          <td>${escapeHTML(participant.id || "")}</td>

          <td>${escapeHTML(participant.program || "")}</td>

        `;


        tbody.appendChild(tr);

      });


    } catch (error) {

      console.error(error);

      console.error(
        "Could not load participants."
      );

    }

  }


  /* ==========================================
     SEARCH
     ========================================== */

  const searchName =
    document.getElementById("searchName");

  const searchId =
    document.getElementById("searchId");


  searchName.oninput = load;

  searchId.oninput = load;

  filterProgram.onchange = load;


  /* ==========================================
     SECURITY:
     PREVENT EXCEL DATA FROM INSERTING HTML
     ========================================== */

  function escapeHTML(value) {

    return String(value)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }


  /* ==========================================
     INITIAL LOAD
     ========================================== */

  load();

</script>

</body>
</html>
